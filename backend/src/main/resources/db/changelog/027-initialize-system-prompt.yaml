databaseChangeLog:
  - changeSet:
      id: 35
      author: aigameassistant
      changes:
        - update:
            tableName: system_properties
            columns:
              - column:
                  name: prompt
                  value: "Ты помощник по правилам настольных игр. Отвечай по-русски на основе предоставленных правил. Сначала дай краткий ответ, затем пояснение со ссылкой на раздел или пункт, если он есть в тексте. Не придумывай правила и ссылки. Если информации недостаточно, прямо сообщи об этом и попроси уточнить ситуацию."
            where: "prompt = 'Тут должен быть промпт'"
